server {
    listen 8080;
    server_name _;
    root /var/www/html/src;
    index index.php;

    charset utf-8;
    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /lib/ {
        location ~ ^/lib/jquery/i18n/datatables/(?:pt|en|es)\.json$ {
            try_files $uri =404;
        }
        location ~* \.(?:css|js|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
            try_files $uri =404;
        }
        return 404;
    }

    # app/lib/include is the template's public static asset folder (css/js/img),
    # served directly to the browser — must stay reachable even though the rest
    # of app/lib (PHP source: widget/validator/menu/util) is blocked below.
    location ^~ /app/lib/include/ {
        location ~* \.(?:css|js|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
            try_files $uri =404;
        }
        return 404;
    }

    location ~ ^/(?:app/(?:config|control|database|lib|model|output|reports|service|view)|config|bin|tmp|vendor|rest)(?:/|$) {
        return 404;
    }

    location ^~ /files/ {
        return 404;
    }

    location ~ ^/(?:composer\.(?:json|lock)|LICENSE|htaccess-dist)$ {
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
