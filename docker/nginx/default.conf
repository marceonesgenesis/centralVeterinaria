# T-04: Allow do /lead.php. Em POST o valor vazio faz o add_header não enviar
# o header; nos demais métodos (405) sai "Allow: POST". Este arquivo é incluído
# no contexto http, por isso o map fica fora do server.
map $request_method $lead_allow {
    POST    "";
    default "POST";
}

server {
    listen 8080;
    server_name _;
    root /var/www/html/src;
    index index.php;

    charset utf-8;
    client_max_body_size 25m;
    server_tokens off;

    # T-04: IP real do visitante para o throttle do lead.php. A rede docker não
    # tem subnet fixa (docker-compose.yml, networks), então confiamos nas faixas
    # RFC1918 inteiras e em 127.0.0.1. Nada na frente deste nginx define
    # X-Forwarded-For e a porta só escuta em 127.0.0.1 (docker-compose.yml,
    # ports); publicar a porta em 0.0.0.0 exige rever set_real_ip_from.
    # Em produção (Apache) isto não vale: o IP real vem do mod_remoteip do
    # servidor (ver T-05 e o runbook).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Redirects relativos (ex.: /landing -> /landing/) sem o host:porta interno
    # (8080) do container.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Landing pública (T-07): "/" sem query string abre a landing; com query
    # (?class=..., ?ajax=...) segue para o Adianti como antes. O rewrite preserva
    # a query string. CSP e Permissions-Policy só nas locations da landing, nunca
    # no server (quebraria os scripts inline do Adianti). add_header numa
    # location anula a herança do server: por isso os 3 headers repetidos.
    location = / {
        if ($args = "") {
            rewrite ^ /landing.php last;
        }
        rewrite ^ /index.php last;
    }

    location = /landing.php {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 60s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    }

    location = /lead.php {
        # T-04: só POST chega ao PHP; os demais métodos recebem 405 com o mesmo
        # JSON do PHP. O if não declara add_header, então herda os 6 desta
        # location (Allow incluso). limit_except foi descartado: responde 403 HTML.
        default_type application/json;
        if ($request_method != POST) {
            return 405 '{"accepted":false,"error":"method_not_allowed"}';
        }
        try_files $uri =404;
        client_max_body_size 16k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 60s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header Allow $lead_allow always;
    }

    location ^~ /landing/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
        location ~ /\. {
            return 404;
        }
        location ~* \.(?:css|js|svg|png|webp|woff2?)$ {
            try_files $uri =404;
        }
        return 404;
    }

    # T-09 correção 1: o navegador pede /favicon.ico sozinho; sem esta location
    # ele cairia no index.php (try_files de "location /") e criaria sessão +
    # Set-Cookie para o visitante anônimo. Serve o PNG estático ou 204.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /favicon.png =204;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /lib/ {
        location ~ ^/lib/jquery/i18n/datatables/(?:pt|en|es)\.json$ {
            try_files $uri =404;
        }
        location ~* \.(?:css|js|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
            try_files $uri =404;
        }
        return 404;
    }

    # app/lib/include is the template's public static asset folder (css/js/img),
    # served directly to the browser — must stay reachable even though the rest
    # of app/lib (PHP source: widget/validator/menu/util) is blocked below.
    location ^~ /app/lib/include/ {
        location ~* \.(?:css|js|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
            try_files $uri =404;
        }
        return 404;
    }

    location ~ ^/(?:app/(?:config|control|database|lib|model|output|reports|service|view)|config|bin|tmp|vendor|rest)(?:/|$) {
        return 404;
    }

    location ^~ /files/ {
        return 404;
    }

    location ~ ^/(?:composer\.(?:json|lock)|LICENSE|htaccess-dist)$ {
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        # nosniff tem fonte única no add_header do server (T-32): um header igual
        # vindo do PHP sairia duplicado ("nosniff, nosniff").
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
