# Proxies confiáveis do nginx no desenvolvimento (Etapa 4, T-02). Incluído pelo
# server de default.conf como /etc/nginx/trusted-proxies.conf; é o padrão de
# NGINX_TRUSTED_PROXIES_FILE no docker-compose.yml.
# A rede docker não tem subnet fixa, então confiamos nas faixas RFC1918 inteiras
# e em 127.0.0.1. Vale só porque a porta do nginx escuta em 127.0.0.1 e nada na
# frente dele define X-Forwarded-For. Não use este arquivo em produção.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
