name: CI

# A pipeline é o script versionado scripts/ci/run.sh, que roda igual aqui e
# na máquina do desenvolvedor: projeto compose próprio (CI_PROJECT), env-file
# gerado em var/ci/.env com segredos de `openssl rand`, banco de teste
# centralvet_test provisionado, schema conferido, lint e suíte. Nenhum
# registry externo é usado e nenhuma imagem é publicada; a tag da imagem é o
# SHA do commit. Ver docs/runbooks/tests.md e docs/runbooks/build-versioning.md.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build images and run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_PROJECT: centralvet-ci
      CI_WORKDIR: var/ci
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # run.sh prints the mysql/redis logs before tearing the project down
      # on failure; its full output is also kept as an artifact.
      - name: Run CI pipeline (scripts/ci/run.sh)
        run: |
          set -o pipefail
          bash scripts/ci/run.sh 2>&1 | tee "$RUNNER_TEMP/ci-run.log"

      - name: Keep pipeline log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: |
            ${{ runner.temp }}/ci-run.log
            var/ci/suite.log
          if-no-files-found: ignore
          retention-days: 7
